<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>Trading Training - Authentification</title>
        <link rel="stylesheet" href="authentification.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>

        <div class="login-card">
            <!--Colonne Gauche : Image / Illustration-->
            <div class="card-left">
                <div class="left-overlay">
                    <span class="left-title">Trading Training</span>
                    <div class="author-info">
                        <div class="author-info">
                            <strong>Trading Training</strong>
                            <small> Master the market</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Colonne Droite : Formulaire -->
         <div class="card-right">
            <div class="brand-header">
                <span class="brand-logo">TRADING.UI</span>
                <button class="lang-btn">FR <span>▼</span></button>
            </div>

            <div class="form-content">
                <h2>Welcome Back</h2>
                <p class="subtitle">Welcome to Trading Training</p>

                <form id="authForm">
                    <div class="input-group">
                        <input type="email" id="email" placeholder="email" required >
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <a href="#" class="forgot-link">Forgot password ?</a>

                    <button type="submit" class="btn-submit">Log In</button>

                    <button type="button" class="btn-google">
                        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google">
                        Login with Google
                    </button>
                </form>
                <p class="signup-prompt">
                    Don't have an account ? <a href="#">Sign Up</a>
                </p>
            </div>
         </div>
        <script src="authentifiaction.js"></script>
    </body>
</html>
