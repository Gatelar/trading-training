<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Training - Nouveau mot de passe</title>
    <link rel="stylesheet" href="authentification.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <script src="../i18n.js?v=6"></script>
</head>
<body>

    <a href="../index.html" class="back-home" data-i18n="nav.backHome">← Retour à l'accueil</a>
    <div class="auth-lang-toggle" id="langToggle"></div>

    <div class="auth-card" style="height:auto;max-width:420px;">
        <div class="form-container" style="position:relative;width:100%;height:auto;left:0;">
            <form id="resetPasswordForm" style="max-width:100%;padding:40px 32px;">
                <span class="eyebrow" data-i18n="auth.eyebrow">Trading Training</span>
                <h2 data-i18n="auth.resetTitle">Nouveau mot de passe</h2>
                <p class="form-subtitle" data-i18n="auth.resetSubtitle">Choisis un nouveau mot de passe pour ton compte.</p>

                <div class="input-group">
                    <input type="password" id="newPassword" placeholder="Nouveau mot de passe (8 caractères min.)" data-i18n="auth.newPasswordPlaceholder" data-i18n-placeholder minlength="8" required>
                </div>
                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirme le mot de passe" data-i18n="auth.confirmPasswordPlaceholder" data-i18n-placeholder minlength="8" required>
                </div>

                <p class="form-message" id="resetMessage"></p>

                <button type="submit" class="btn-submit" data-i18n="auth.resetSubmit">Mettre à jour le mot de passe</button>
            </form>

            <div id="resetInvalidState" style="display:none;padding:40px 32px;">
                <span class="eyebrow" data-i18n="auth.eyebrow">Trading Training</span>
                <h2 data-i18n="auth.resetTitle">Nouveau mot de passe</h2>
                <p class="form-message is-error" style="margin:16px 0 22px;" data-i18n="auth.resetInvalidLink">Ce lien de réinitialisation est invalide ou a expiré. Refais une demande depuis la page de connexion.</p>
                <a href="authentification.html" class="btn-submit" style="display:block;text-align:center;text-decoration:none;" data-i18n="auth.resetBackToLogin">Retour à la connexion</a>
            </div>
        </div>
    </div>

    <script src="reset-password.js"></script>
    <script src="../lang-toggle.js?v=3"></script>
</body>
</html>
