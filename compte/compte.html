<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Training - Mon compte</title>
    <link rel="stylesheet" href="../style.css?v=6">
    <link rel="stylesheet" href="compte.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <script src="../i18n.js?v=5"></script>
</head>
<body>

    <header class="top-bar">
        <a href="../index.html" class="logo-container">
            <img src="../logott.png" alt="Logo Trading Training" class="logo">
        </a>
        <div class="top-bar-right">
            <div id="langToggle"></div>
            <div class="top-bar-actions" id="topBarActions" data-prefix="../">
<a href="../authentification/authentification.html" class="btn-login" data-i18n="nav.login">Se connecter</a>
        </div>
        </div>
    </header>

    <section class="account-wrap reveal">
        <span class="eyebrow" data-i18n="account.eyebrow">Mon compte</span>
        <h1 id="accountName">—</h1>
        <p class="account-email" id="accountEmail">—</p>

        <p class="checkout-success" id="checkoutSuccess" style="display:none;" data-i18n="account.checkoutSuccess">✓ Abonnement activé, bienvenue chez les traders actifs !</p>

        <div class="account-cards">
            <div class="account-card">
                <span class="account-card-label" data-i18n="account.currentPlanLabel">Offre actuelle</span>
                <p class="account-card-value"><span id="planLabel" data-i18n="plan.freeTitle">Découverte</span> <span class="tag-free" id="planTag" data-i18n="plan.freeBadge">gratuit</span></p>
                <a href="../abonnement/abonnement.html" class="account-card-link" data-i18n="account.viewSubscription">Voir l'abonnement →</a>
            </div>

            <div class="account-card" id="quotaCard">
                <span class="account-card-label" data-i18n="account.exercisesToday">Exercices aujourd'hui</span>
                <p class="account-card-value" id="quotaValue">— / 3</p>
                <p class="account-card-note" data-i18n="account.resetNote">Réinitialisé chaque jour à minuit.</p>
            </div>
        </div>

        <button class="btn-secondary account-logout" id="logoutBtn" data-i18n="account.logout">Se déconnecter</button>
    </section>

    <script src="../app.js"></script>
    <script src="compte.js"></script>
    <script src="../auth-state.js?v=4"></script>
    <script src="../lang-toggle.js?v=3"></script>
</body>
</html>
