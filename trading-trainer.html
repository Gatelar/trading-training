<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trade Trainer — Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="data/macro-events-eurusd.js"></script>
<style>
html,body{margin:0;background:#000;}
#root{display:none;}
#tt-gate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;color:#f4f6f2;font-family:'Inter',sans-serif;
  padding:24px;
}
#tt-gate h2{font-family:'Oswald',sans-serif;font-size:1.8rem;margin:0 0 14px;}
#tt-gate p{color:#9aa39a;max-width:420px;line-height:1.6;margin:0 0 26px;}
#tt-gate a{
  display:inline-block;padding:14px 32px;background-color:#CDFC8A;color:#06170a;
  text-decoration:none;font-family:'Oswald',sans-serif;font-weight:600;border-radius:8px;
}
</style>
</head>
<body>
<div id="root"></div>
<div id="tt-gate" style="display:none;"></div>
<script>
(async function () {
  const gate = document.getElementById('tt-gate');
  const root = document.getElementById('root');

  // Comptes admin : jamais soumis au quota d'exercices.
  const ADMIN_EMAILS = ['bidiyacine59@gmail.com'];

  function block(title, message, ctaLabel, ctaHref) {
    gate.innerHTML = `<h2>${title}</h2><p>${message}</p><a href="${ctaHref}">${ctaLabel}</a>`;
    gate.style.display = 'flex';
    root.style.display = 'none';
  }

  function allow() {
    root.style.display = 'block';
  }

  const { data: { session } } = await supabaseClient.auth.getSession();

  if (session && ADMIN_EMAILS.includes(session.user.email)) {
    allow();
    return;
  }

  if (session) {
    const { data: sub } = await supabaseClient
      .from('subscriptions')
      .select('status')
      .eq('user_id', session.user.id)
      .maybeSingle();
    if (sub && (sub.status === 'active' || sub.status === 'trialing')) {
      allow();
      return;
    }
  }

  if (!session) {
    const today = new Date().toISOString().slice(0, 10);
    const key = 'tt_anon_exercise_' + today;
    if (localStorage.getItem(key)) {
      block(
        'Limite atteinte pour aujourd\'hui',
        'Tu as déjà utilisé ton exercice gratuit du jour. Crée un compte pour continuer à t\'entraîner.',
        'Créer un compte',
        'authentification/authentification.html'
      );
      return;
    }
    localStorage.setItem(key, '1');
    allow();
    return;
  }

  const startOfDay = new Date();
  startOfDay.setHours(0, 0, 0, 0);

  const { count, error } = await supabaseClient
    .from('exercise_logs')
    .select('*', { count: 'exact', head: true })
    .eq('user_id', session.user.id)
    .gte('created_at', startOfDay.toISOString());

  if (error) {
    console.error('Erreur de vérification du quota :', error);
    allow();
    return;
  }

  if (count >= 3) {
    block(
      'Limite quotidienne atteinte',
      'Tu as utilisé tes 3 exercices gratuits du jour. Passe à l\'abonnement pour un accès illimité.',
      'Voir l\'abonnement',
      'abonnement/abonnement.html'
    );
    return;
  }

  await supabaseClient.from('exercise_logs').insert({ user_id: session.user.id });
  allow();
})();
</script>
